api: Botify API
format: proprietary
rfc9457: false
note: Botify does NOT use RFC 9457 application/problem+json. It returns a proprietary JSON envelope on 4xx, with a numeric
  `error_code` that is more specific than the HTTP status. The 61 codes below are published verbatim on the legacy developer
  portal (old.developers.botify.com); the current ReadMe-hosted portal at developers.botify.com has NOT carried the error
  reference forward, and the Swagger declares only a single untyped `default` response per operation bound to DefaultPayload.
  So the machine-readable contract tells a client nothing about errors — the only usable error reference is on the retired
  portal.
envelope:
  media_type: application/json
  schema: '#/definitions/DefaultPayload'
  shape:
    error:
      error_code: string — numeric Botify error code (see problems[])
      message: string — human-readable message
      error_detail: object — optional detail, present on some errors
http_statuses_documented:
  4xx: Any client error returns the error envelope with an error_code.
  '429': Returned once a rate limit or export quota is hit (https://old.developers.botify.com/api/rate-limit/). No Retry-After
    header is published.
derived_from_openapi:
  operations: 48
  declared_error_responses: 0
  note: Every operation declares only 200/201 plus a single `default` response. No 4xx or 5xx status code appears anywhere
    in openapi/botify-api-swagger.json.
