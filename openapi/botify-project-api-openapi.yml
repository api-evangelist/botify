openapi: 3.2.0
info:
  version: 1.0.0
  description: Botify Saas API
  title: Botify Project API
  x-codegen-settings:
    useMethodPrefix: false
    useModelPostfix: false
    useControllerPostfix: false
    useEnumPostfix: false
    useConstructorsForConfig: false
    collectParameters: true
    brandLabel: Botify
    nodeHttpClient: NODE_SUPERAGENT
    arraySerialization: CSV
servers:
- url: https://api.botify.com/v1
security:
- DjangoRestToken: []
tags:
- name: Project
paths:
  /analyses/{username}/{project_slug}:
    parameters:
    - description: User's identifier
      required: true
      name: username
      in: path
      schema:
        type: string
    - description: Project's identifier
      required: true
      name: project_slug
      in: path
      schema:
        type: string
    get:
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    readOnly: true
                    type: integer
                    description: ''
                  results:
                    items:
                      $ref: '#/components/schemas/Analysis'
                    readOnly: true
                    type: array
                    description: ''
                  next:
                    readOnly: true
                    type: string
                    description: ''
                  previous:
                    readOnly: true
                    type: string
                    description: ''
                  page:
                    readOnly: true
                    type: integer
                    description: ''
                  size:
                    readOnly: true
                    type: integer
                    description: ''
        default:
          description: error payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultPayload'
      parameters:
      - description: Page Number
        name: page
        in: query
        schema:
          type: integer
      - description: Page Size
        name: size
        in: query
        schema:
          type: integer
      tags:
      - Project
      summary: List all analyses for a project
      operationId: getProjectAnalyses
  /projects/{username}/{project_slug}/features/url_rewriting/rules_validator:
    parameters:
    - description: User's identifier
      required: true
      name: username
      in: path
      schema:
        type: string
    - description: Project's identifier
      required: true
      name: project_slug
      in: path
      schema:
        type: string
    post:
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URLRewritingRulesSerializer'
        default:
          description: error payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultPayload'
      description: Match and replace parts of a URL based on rules passed in POST data.
      tags:
      - Project
      summary: Match and replace parts of a URL based on rules passed in POST data
      operationId: testUrlRewritingRules
  /projects/{username}/{project_slug}/filters:
    parameters:
    - description: User's identifier
      required: true
      name: username
      in: path
      schema:
        type: string
    - description: Project's identifier
      required: true
      name: project_slug
      in: path
      schema:
        type: string
    get:
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    readOnly: true
                    type: integer
                    description: ''
                  results:
                    items:
                      $ref: '#/components/schemas/ProjectSavedFilter'
                    readOnly: true
                    type: array
                    description: ''
                  next:
                    readOnly: true
                    type: string
                    description: ''
                  previous:
                    readOnly: true
                    type: string
                    description: ''
                  page:
                    readOnly: true
                    type: integer
                    description: ''
                  size:
                    readOnly: true
                    type: integer
                    description: ''
        default:
          description: error payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultPayload'
      parameters:
      - description: Page Number
        name: page
        in: query
        schema:
          type: integer
      - description: Page Size
        name: size
        in: query
        schema:
          type: integer
      tags:
      - Project
      summary: List all the project's saved filters (each filter's name, ID and filter value)
      operationId: getSavedFilters
  /projects/{username}/{project_slug}/filters/{identifier}:
    parameters:
    - description: User's identifier
      required: true
      name: username
      in: path
      schema:
        type: string
    - description: Project's identifier
      required: true
      name: project_slug
      in: path
      schema:
        type: string
    - description: Saved Filter's identifier
      required: true
      name: identifier
      in: path
      schema:
        type: string
    get:
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSavedFilter'
        default:
          description: error payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultPayload'
      tags:
      - Project
      summary: Retrieves a specific saved filter's name, ID and filter value
      operationId: getSavedFilter
  /projects/{username}/{project_slug}/urls/aggs:
    parameters:
    - description: User's identifier
      required: true
      name: username
      in: path
      schema:
        type: string
    - description: Project's identifier
      required: true
      name: project_slug
      in: path
      schema:
        type: string
    post:
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Default'
        default:
          description: error payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultPayload'
      description: Project Query aggregator. It accepts multiple queries that will be executed on all completed analyses in the project
      parameters:
      - description: Analysis context to execute the queries
        required: false
        in: query
        name: area
        schema:
          type: string
          enum:
          - current
          - disappeared
          - new
          default: current
      - description: Last analysis on the trend
        required: false
        name: last_analysis_slug
        in: query
        schema:
          type: string
      - description: Max number of analysis to return
        required: false
        in: query
        name: nb_analyses
        schema:
          type: integer
          format: int32
          default: 20
          maximum: '20'
          minimum: '1'
      tags:
      - Project
      summary: Project Query aggregator
      operationId: getProjectUrlsAggs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlsAggsQueries'
components:
  schemas:
    DefaultPayload:
      type: object
      description: default payload for object for all HTTP codes that are not covered individually
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: Error Message
            error_code:
              type: string
              description: Error Code
            error_detail:
              type: object
              description: If available, detailed error
    RewritingRuleSerializer:
      required:
      - regex
      - replace
      - ignore_case
      type: object
      properties:
        regex:
          readOnly: false
          type: string
          description: ''
        replace:
          readOnly: false
          type: string
          description: ''
        ignore_case:
          readOnly: false
          type: boolean
          description: ''
    UrlsAggsQuery:
      type: object
      properties:
        filters:
          readOnly: false
          type: object
          description: ''
        aggs:
          description: ''
          items:
            type: object
          readOnly: false
          type: array
    URLRewritingRulesSerializer:
      required:
      - urls
      - rules
      type: object
      properties:
        urls:
          description: ''
          items:
            type: string
          readOnly: false
          type: array
        rules:
          description: ''
          items:
            $ref: '#/components/schemas/RewritingRuleSerializer'
          readOnly: false
          type: array
    Default:
      type: object
      properties: {}
    UrlsAggsQueries:
      items:
        $ref: '#/components/schemas/UrlsAggsQuery'
      type: array
    Analysis:
      required:
      - user
      type: object
      properties:
        id:
          readOnly: true
          type: integer
          description: ''
          format: int64
        user:
          readOnly: false
          description: ''
          $ref: '#/components/schemas/User'
        slug:
          readOnly: true
          type: string
          description: ''
        name:
          readOnly: true
          type: string
          description: ''
        url:
          readOnly: true
          type: string
          description: ''
        features:
          readOnly: true
          type: string
          description: ''
        status:
          readOnly: true
          type: string
          description: ''
        urls_done:
          readOnly: true
          type: string
          description: ''
        urls_in_queue:
          readOnly: true
          type: string
          description: ''
        config:
          readOnly: true
          type: string
          description: ''
        date_created:
          readOnly: false
          type: string
          description: ''
          format: date-time
        date_launched:
          readOnly: false
          type: string
          description: ''
          format: date-time
        date_finished:
          readOnly: false
          type: string
          description: ''
          format: date-time
        date_last_modified:
          readOnly: false
          type: string
          description: Date of last modified analysis
          format: date-time
    User:
      type: object
      properties:
        login:
          readOnly: true
          type: string
          description: ''
        email:
          readOnly: false
          type: string
          description: ''
        is_organization:
          readOnly: true
          type: string
          description: ''
        url:
          readOnly: true
          type: string
          description: ''
        date_joined:
          readOnly: false
          type: string
          description: ''
          format: date-time
        status:
          readOnly: false
          type: string
          description: ''
        first_name:
          readOnly: false
          type: string
          description: ''
        last_name:
          readOnly: false
          type: string
          description: ''
        company_name:
          readOnly: false
          type: string
          description: ''
    ProjectSavedFilter:
      required:
      - name
      - filters
      type: object
      properties:
        name:
          readOnly: false
          type: string
          description: ''
        filters:
          readOnly: false
          type: object
          description: ''
        identifier:
          readOnly: true
          type: string
          description: ''
  securitySchemes:
    DjangoRestToken:
      type: apiKey
      name: Authorization
      in: header
x-provenance:
  method: harvested
  publisher: Botify
  source: https://raw.githubusercontent.com/botify-labs/botify-sdk-js/master/swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
