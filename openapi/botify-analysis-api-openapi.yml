openapi: 3.2.0
info:
  version: 1.0.0
  description: Botify Saas API
  title: Botify Analysis API
  x-codegen-settings:
    useMethodPrefix: false
    useModelPostfix: false
    useControllerPostfix: false
    useEnumPostfix: false
    useConstructorsForConfig: false
    collectParameters: true
    brandLabel: Botify
    nodeHttpClient: NODE_SUPERAGENT
    arraySerialization: CSV
servers:
- url: https://api.botify.com/v1
security:
- DjangoRestToken: []
tags:
- name: Analysis
paths:
  /analyses/{username}/{project_slug}/{analysis_slug}:
    parameters:
    - description: User's identifier
      required: true
      name: username
      in: path
      schema:
        type: string
    - description: Project's identifier
      required: true
      name: project_slug
      in: path
      schema:
        type: string
    - description: Analysis' identifier
      required: true
      name: analysis_slug
      in: path
      schema:
        type: string
    get:
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisDetail'
        default:
          description: error payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultPayload'
      tags:
      - Analysis
      summary: Get an Analysis detail
      operationId: getAnalysisSummary
