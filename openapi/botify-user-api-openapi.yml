openapi: 3.2.0
info:
  version: 1.0.0
  description: Botify Saas API
  title: Botify User API
  x-codegen-settings:
    useMethodPrefix: false
    useModelPostfix: false
    useControllerPostfix: false
    useEnumPostfix: false
    useConstructorsForConfig: false
    collectParameters: true
    brandLabel: Botify
    nodeHttpClient: NODE_SUPERAGENT
    arraySerialization: CSV
servers:
- url: https://api.botify.com/v1
security:
- DjangoRestToken: []
tags:
- name: User
paths:
  /projects/{username}:
    parameters:
    - description: User's identifier
      required: true
      name: username
      in: path
      schema:
        type: string
    get:
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    readOnly: true
                    type: integer
                    description: ''
                  results:
                    items:
                      $ref: '#/components/schemas/Project'
                    readOnly: true
                    type: array
                    description: ''
                  next:
                    readOnly: true
                    type: string
                    description: ''
                  previous:
                    readOnly: true
                    type: string
                    description: ''
                  page:
                    readOnly: true
                    type: integer
                    description: ''
                  size:
                    readOnly: true
                    type: integer
                    description: ''
        default:
          description: error payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultPayload'
      parameters:
      - description: Page Number
        name: page
        in: query
        schema:
          type: integer
      - description: Page Size
        name: size
        in: query
        schema:
          type: integer
      tags:
      - User
      summary: List all active projects for the user
      operationId: getUserProjects
components:
  schemas:
    User:
      type: object
      properties:
        login:
          readOnly: true
          type: string
          description: ''
        email:
          readOnly: false
          type: string
          description: ''
        is_organization:
          readOnly: true
          type: string
          description: ''
        url:
          readOnly: true
          type: string
          description: ''
        date_joined:
          readOnly: false
          type: string
          description: ''
          format: date-time
        status:
          readOnly: false
          type: string
          description: ''
        first_name:
          readOnly: false
          type: string
          description: ''
        last_name:
          readOnly: false
          type: string
          description: ''
        company_name:
          readOnly: false
          type: string
          description: ''
    ProjectSettingsSerializer:
      required:
      - start_urls
      - max_nb_pages
      - blacklisted_domains
      - allowed_domains
      - sitemaps
      - header_settings
      type: object
      properties:
        start_urls:
          description: ''
          items:
            type: string
          readOnly: false
          type: array
        max_nb_pages:
          description: ''
          format: int64
          maximum: 2147483647
          readOnly: false
          minimum: 1
          type: integer
        max_depth:
          description: ''
          format: int64
          maximum: 2147483647
          readOnly: false
          minimum: 0
          type: integer
        compare_crawl:
          readOnly: false
          type: boolean
          description: ''
        blacklisted_domains:
          description: ''
          items:
            type: string
          readOnly: false
          type: array
        allowed_domains:
          description: ''
          items:
            type: string
          readOnly: false
          type: array
        respect_nofollow:
          readOnly: false
          type: boolean
          description: ''
        crawl_gzip:
          readOnly: false
          type: boolean
          description: ''
        has_robots_txt:
          readOnly: true
          type: string
          description: ''
        user_agent:
          readOnly: false
          type: string
          description: ''
        max_pages_per_sec:
          description: ''
          format: int64
          maximum: 2147483647
          readOnly: false
          minimum: 1
          type: integer
        extra_headers:
          readOnly: false
          type: string
          description: ''
        google_social_auth_id:
          description: ''
          format: int64
          maximum: 2147483647
          readOnly: false
          minimum: -2147483648
          type: integer
        google_analytics_site_id:
          description: ''
          format: int64
          maximum: 2147483647
          readOnly: false
          minimum: -2147483648
          type: integer
        google_analytics_account_email:
          readOnly: false
          type: string
          description: Keep email in case user delete his social auth connection
        google_analytics_nb_days:
          description: ''
          format: int64
          maximum: 90
          readOnly: false
          minimum: 1
          type: integer
        sitemaps:
          description: ''
          items:
            type: string
          readOnly: false
          type: array
        header_settings:
          description: ''
          items:
            type: string
          readOnly: false
          type: array
    Project:
      required:
      - name
      - slug
      - user
      - current_settings
      type: object
      properties:
        name:
          readOnly: false
          type: string
          description: ''
        slug:
          readOnly: false
          type: string
          description: ''
        user:
          readOnly: false
          description: ''
          $ref: '#/components/schemas/User'
        current_settings:
          readOnly: false
          description: ''
          $ref: '#/components/schemas/ProjectSettingsSerializer'
        active:
          readOnly: false
          type: boolean
          description: ''
        date_created:
          readOnly: true
          type: string
          description: ''
    DefaultPayload:
      type: object
      description: default payload for object for all HTTP codes that are not covered individually
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              description: Error Message
            error_code:
              type: string
              description: Error Code
            error_detail:
              type: object
              description: If available, detailed error
  securitySchemes:
    DjangoRestToken:
      type: apiKey
      name: Authorization
      in: header
x-provenance:
  method: harvested
  publisher: Botify
  source: https://raw.githubusercontent.com/botify-labs/botify-sdk-js/master/swagger.json
