note: Botify runs both a documented REST surface (api.botify.com/v1, Swagger 2.0) and a hosted MCP server (mcp.botify.com).
  The MCP tools/list call is OAuth-gated (HTTP 401 invalid_token) and Botify publishes no tool catalog in its llms.txt or
  docs, so NO tool name is known to us. Rather than invent a mapping, this crosswalk records the REST side in full and leaves
  crosswalk[] empty until an authenticated introspection is possible. Every REST operation below is therefore listed as rest_only,
  meaning "no PUBLICLY KNOWN tool binds to it" — not "the MCP server cannot do it".
