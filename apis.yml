- name: Botify Agents MCP
  description: >-
    Hosted Model Context Protocol server at mcp.botify.com, advertised via RFC 9728 protected-resource metadata
    as "Botify Agents MCP" with the single scope mcp_read_write. Authorization is delegated to app.botify.com,
    which publishes RFC 8414 authorization-server metadata supporting authorization_code + refresh_token,
    PKCE S256 and OAuth 2.0 Dynamic Client Registration. tools/list is auth-gated.
  humanURL: https://www.botify.com/platform/botify-assist
  baseURL: https://mcp.botify.com/
