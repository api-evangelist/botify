apis:
- name: Botify API
  description: >-
    REST API (Swagger 2.0, 46 paths / 48 operations) over Botify projects, analyses, crawl statistics, URL-level
    data, collections, saved filters, saved explorers, datasources and export jobs. SEO data itself is retrieved
    by POSTing a BQL query to /projects/{username}/{project_slug}/query or by creating an export job at /jobs.
    Authenticated with a per-user API token sent in the Authorization header.
  humanURL: https://developers.botify.com/
  baseURL: https://api.botify.com/v1
