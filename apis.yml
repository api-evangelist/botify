aid: botify
name: Botify
description: >-
  Botify is an enterprise organic-search and AI-search visibility platform that crawls a brand's website,
  ingests its server logs, and joins that with Google Search Console, analytics and third-party data to produce
  thousands of SEO metrics across its SiteCrawler, LogAnalyzer, RealKeywords, ActionBoard, AlertPanel,
  SpeedWorkers, PageWorkers and EngagementAnalytics products. All of that data is reachable programmatically
  through the Botify REST API at api.botify.com/v1, which is documented with Swagger/OpenAPI and driven by BQL
  (Botify Query Language), a JSON DSL used both for interactive queries (up to 2,000 rows per call) and for
  large export jobs delivered to direct download, AWS S3, AWS Redshift, Google Cloud Storage or Google BigQuery.
  Botify also operates a hosted, OAuth-protected MCP server ("Botify Agents MCP") at mcp.botify.com so agents
  can work with Botify data alongside the company's own AI agents.
