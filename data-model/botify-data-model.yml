gaps:
- >-
  The URL-level data (the actual SEO metrics) is NOT in this schema. It is reached through BQL over
  collections, where the field set is project- and crawl-specific. Any client must call getUrlsDatamodel,
  getProjectCollections or getCollectionDetail to discover fields at runtime.
- >-
  A large family of Admin* definitions (AdminProject, AdminProjectSettings with 48 properties, AdminRules,
  AdminPattern, AdminBucket, AdminSavedExplorer, AdminValuesList, AdminFileDatasource...) is present in the
  published Swagger but bound to NO public path — internal shapes leaking into the public contract.
