  identifier_style: human-readable slugs, not opaque prefixed ids
note: >-
  Botify's model is a three-level hierarchy — a User owns Projects, a Project has Analyses (crawls), and an
  Analysis has URLs — and almost every path in the API literally spells that hierarchy out as
  /{username}/{project_slug}/{analysis_slug}/. There are no opaque object ids with type prefixes: entities are
  addressed by human-readable slugs (`username`, `project_slug`, `analysis_slug` which is a YYYYMMDD crawl
  date). The one exception is the async job family, which uses numeric ids (`job_id`, `url_export_id`).
  Below the Analysis sits the DATA layer, which is not modelled as REST resources at all — it is reached
  through BQL over named collections, and the field set is project-specific and must be read at runtime from
  the datamodel/collection endpoints rather than assumed from this schema.
